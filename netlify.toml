[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Catatan: backend (/api + SQLite) adalah server Express. Netlify hanya men-host
# frontend statis; jalankan backend (npm start) di host Node.js yang mendukung file.
# Single Page Application (SPA) fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
